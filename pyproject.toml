[project]
name = "strategybench"
version = "0.1.0"
description = "Measure how strategically exploitable LLM agents are in small imperfect-information games"
authors = [
    { name = "Gary Harney", email = "garyjh126@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=1.12.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.11",
    "numpy>=2.5.3",
    "open-spiel==2.0.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "research/multiway", "apps/gui/tests"]
